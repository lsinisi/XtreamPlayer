// Quanti riquadri: al massimo 4, e non più delle connessioni che l'abbonamento permette
const multiMax = () => { const mc = Number(S.acct && S.acct.max_connections) || 0; return mc > 1 ? Math.min(4, mc) : (mc === 1 ? 2 : 4); };
async function pMulti(r, tok){
  r.title = 'Multischermo';
  setBar({title:'Multischermo', acts:''});
  let D;
  try { await ensure('live'); D = vis('live'); } catch(e) { if (live(tok)) V.innerHTML = errBox(e.message); return; }
  if (!live(tok)) return;
  const max = multiMax(), mc = Number(S.acct && S.acct.max_connections) || 0;
  S.multi = (S.multi || lsGet(ns('multi'), [])).filter(k => okItem(S.byKey[k])).slice(0, max);
  const note = mc === 1 ? 'Il tuo abbonamento permette una sola connessione alla volta: con due canali insieme è probabile che uno dei due si blocchi.'
    : (mc ? `Il tuo abbonamento permette ${mc} connessioni insieme, quindi puoi affiancare fino a ${max} canali.` : 'Quanti canali puoi vedere insieme dipende dalle connessioni permesse dal tuo abbonamento.');
  V.innerHTML = page(`<h1 class="big">Multischermo<small>${max > 2 ? `Scegli da 2 a ${max} canali` : 'Scegli 2 canali'} da guardare insieme</small></h1><div class="mslots" id="mslots"></div>`
    + `<p class="note" style="margin:0 2px 22px">${esc(note)} Si sente l'audio del canale che tocchi.</p>`
    + `<label class="sfield">${ICON.search}<input id="mq" type="search" placeholder="Cerca un canale da aggiungere" autocomplete="off" enterkeyhint="search"></label><div class="chlist" id="mlist"></div>`
    + `<button class="btn primary block" id="mgo" data-mgo></button>`);
  paintSlots();
  const favFirst = [...favs.map(k => S.byKey[k]).filter(o => okItem(o) && o.type === 'live'), ...D.items.filter(o => !isFav(o.key))];
  const paint = () => {
    const f = fold(($('#mq').value || '').trim());
    const res = f ? favFirst.filter(o => o.lc.includes(f) || String(o.raw.num) === f) : favFirst;
    if (!res.length) { $('#mlist').innerHTML = `<div class="empty" style="padding:30px"><p style="margin:0">Nessun canale trovato.</p></div>`; return; }
    lazyList($('#mlist'), res, mRow);
  };
  paint();
  $('#mq').addEventListener('input', debounce(paint, 140));
}
function mRow(o){
  const on = S.multi.includes(o.key);
  return `<div class="chrow${on ? ' picked' : ''}" data-mpick="${esc(o.key)}" role="button" tabindex="0"><span class="clogo">${initials(o.name)}${o.img ? `<img src="${esc(o.img)}" loading="lazy" alt="" onerror="this.remove()">` : ''}</span>`
    + `<span class="cmain"><span class="ctop">${o.raw.num ? `<i class="cnum">${esc(o.raw.num)}</i>` : ''}<b>${esc(o.name)}</b></span></span><span class="cact">${on ? ICON.check : ICON.plus}</span></div>`;
}
function paintSlots(){
  const box = $('#mslots'); if (!box) return;
  const max = multiMax();
  box.innerHTML = Array.from({length:max}, (_, i) => {
    const o = S.byKey[S.multi[i]];
    return o ? `<div class="mslot">${o.img ? `<img src="${esc(o.img)}" alt="" onerror="this.remove()">` : `<span class="ph">${initials(o.name)}</span>`}<b>${esc(o.name)}</b><button class="rm" data-mrm="${esc(o.key)}" aria-label="Togli ${esc(o.name)}">${ICON.x}</button></div>`
      : `<div class="mslot empty">Canale ${i + 1}</div>`;
  }).join('');
  const b = $('#mgo'), n = S.multi.length;
  b.disabled = n < 2;
  b.innerHTML = n < 2 ? (n ? 'Scegli almeno un altro canale' : 'Scegli almeno 2 canali') : `${ICON.multi} Guarda ${n} canali insieme`;
}
function toggleMulti(key){
  const max = multiMax(), on = S.multi.includes(key);
  if (!on && S.multi.length >= max) return toast(`Puoi affiancare al massimo ${max} canali: togline uno per cambiarlo`);
  S.multi = on ? S.multi.filter(k => k !== key) : [...S.multi, key];
  lsSet(ns('multi'), S.multi);
  paintSlots();
  $$(`[data-mpick="${CSS.escape(key)}"]`).forEach(el => { el.classList.toggle('picked', !on); el.querySelector('.cact').innerHTML = on ? ICON.plus : ICON.check; });
}
async function startMulti(keys){
  try { await ensure('live'); } catch(e) { toast(e.message); return; }
  const D = vis('live'), items = keys.map(k => S.byKey[k]).filter(okItem);
  if (!items.length) return;
  if (!NATIVE_MULTI) return toast('Il multischermo funziona nell\'app installata sull\'iPhone');
  const [s, u, p] = authParts();
  const sample = iosSource({live:true, url:`${s}/live/${u}/${p}/0.ts`});
  const m = o => ({id:String(o.id), name:o.name, num:String(o.raw.num ?? '')});
  S.pl = null;
  native('multi', {cmd:'open', prefix:`${s}/live/${u}/${p}/`, suffix:sample.slice(sample.lastIndexOf('.')), max:multiMax(), accent:accentHex(), items:items.map(m), pool:D.items.slice(0, 4000).map(m)});
}

// ================= canali recenti e ultimo canale =================
const recentLive = () => lsGet(ns('recentLive'), []).map(k => S.byKey[k]).filter(Boolean);
function noteLive(o){
  lsSet(ns('recentLive'), [o.key, ...lsGet(ns('recentLive'), []).filter(k => k !== o.key)].slice(0, 20));
  lsSet(ns('lastLive'), o.key);
  S.dirty = true;
}
async function maybeStartLast(){
  if (!lsGet('xp_startlast', false)) return;
  const k = lsGet(ns('lastLive'), null); if (!k) return;
  try { await ensure('live'); } catch(_) { return; }
  const o = S.byKey[k];
  if (o && okItem(o) && !S.pl) playLive(o);
}

// ================= tocchi =================
document.addEventListener('click', async e => {
  const t = e.target;
  if ($('#app').classList.contains('hidden')) return;
  const th = t.closest('[data-theme-pick]'); if (th) { setTheme(th.dataset.themePick); return; }
  if (t.closest('[data-back]')) return back();
  const tb = t.closest('[data-tab]'); if (tb) return setTab(tb.dataset.tab);
  if (t.closest('[data-account]')) return accountSheet();
  if (t.closest('[data-logout]')) return logout();
  if (t.closest('[data-retry]')) return renderRoute(false);

  const fv = t.closest('[data-fav]');
  if (fv) {
    e.stopPropagation();
    const on = toggleFav(fv.dataset.fav);
    toast(on ? 'Aggiunto alla tua lista' : 'Tolto dalla tua lista');
    if (fv.classList.contains('cact')) { fv.classList.toggle('on', on); fv.innerHTML = on ? ICON.starF : ICON.star; }
    else if (fv.classList.contains('ib')) fv.innerHTML = on ? ICON.starF : ICON.star;
    else fv.innerHTML = on ? ICON.check : ICON.plus;
    return;
  }
  const mr = t.closest('[data-mrm]'); if (mr) return toggleMulti(mr.dataset.mrm);
  const mp = t.closest('[data-mpick]'); if (mp) return toggleMulti(mp.dataset.mpick);
  if (t.closest('[data-mgo]')) return startMulti(S.multi);
  const ep = t.closest('[data-epg]'); if (ep) return push({v:'epg', key:ep.dataset.epg});
  const pr = t.closest('[data-prog]'); if (pr) return playProg(pr);
  const rs = t.closest('[data-resume]'); if (rs) return resume(rs.dataset.resume);
  const pl = t.closest('[data-play]');
  if (pl) { const o = S.byKey[pl.dataset.play]; if (o) o.type === 'movie' ? playMovie(o) : push({v:'detail', key:o.key}); return; }
  const k = t.closest('[data-k]');
  if (k) {
    const o = S.byKey[k.dataset.k]; if (!o) return;
    if (o.type === 'live') return playLive(o);
    if (blocked(o.type, o.cat) && !(await unlock())) return;
    return push({v:'detail', key:o.key});
  }
  const ro = t.closest('[data-route]');
  if (ro) {
    const route = JSON.parse(ro.dataset.route);
    if (route.cat && route.cat !== 'all' && (route.v === 'livecat' || route.v === 'cat')) {
      const type = route.v === 'livecat' ? 'live' : route.type;
      if (isLockedCat(type, route.cat) && !(await unlock('Questa categoria è protetta dal controllo genitori.'))) return;
    }
    if (route.v === 'list') { if (route.mode) S.listMode = route.mode; if (cur().v === 'list') return closeSheet(); return push({v:'list'}); }
    return push(route);
  }
  // scheda: riproduci, lista, VLC, stagioni, episodi
  const r = cur();
  if (r.v === 'detail') {
    const o = S.byKey[r.key];
    const act = t.closest('[data-act]');
    if (act && o) {
      const a = act.dataset.act;
      if (a === 'play') return o.type === 'movie' ? playMovie(o) : playSeries(o);
      if (a === 'fav') { const on = toggleFav(o.key); act.innerHTML = on ? ICON.check + ' Nella lista' : ICON.plus + ' La mia lista'; toast(on ? 'Aggiunto alla tua lista' : 'Tolto dalla tua lista'); return; }
      if (a === 'vlc') { const [s, u, p] = authParts(); native('external', {url:`${s}/movie/${u}/${p}/${o.id}.${o.raw.container_extension || 'mp4'}`, title:o.name}) || toast('Disponibile nell\'app per iPhone'); return; }
    }
    if (t.closest('#plotMore')) { $('#plot').classList.toggle('clamp'); $('#plotMore').textContent = $('#plot').classList.contains('clamp') ? 'Altro' : 'Meno'; return; }
    const sb = t.closest('[data-season]'); if (sb && o) { r.season = sb.dataset.season; $$('[data-season]').forEach(b => b.classList.toggle('on', b === sb)); $('#eps').innerHTML = episodesHtml(o, r.season); return; }
    const eb = t.closest('[data-ep]'); if (eb && o) return playEpisode(o, r.season, epsOf(o)[r.season][+eb.dataset.ep]);
  }
  const lm = t.closest('[data-live-mode]'); if (lm) { S.liveMode = lm.dataset.liveMode; lsSet('xp_livemode', S.liveMode); return renderRoute(false); }
  const gc = t.closest('[data-guide-cat]');
  if (gc) { S.guideCat = gc.dataset.guideCat; const y = scrollY; renderRoute(false); scrollTo(0, y); return; }
  const tm = t.closest('[data-type-mode]'); if (tm) { S.typeMode[r.v] = tm.dataset.typeMode; lsSet('xp_typemode', S.typeMode); return renderRoute(false); }
  const lsm = t.closest('[data-list-mode]'); if (lsm) { S.listMode = lsm.dataset.listMode; return renderRoute(false); }
  if (t.closest('[data-sort]')) return sortSheet();
  const sp = t.closest('[data-sort-pick]');
  if (sp) { r.sort = sp.dataset.sortPick; closeSheet(); $('#sortLbl').textContent = SORTS.find(s => s[0] === r.sort)[1]; if (S.repaintCat) S.repaintCat(); return; }
  const sf = t.closest('[data-sf]'); if (sf && r.v === 'search') { r.f = sf.dataset.sf; $$('[data-sf].chip').forEach(b => b.classList.toggle('on', b.dataset.sf === r.f)); searchResults(r); scrollTo(0, 0); return; }
  const past = t.closest('[data-past]'); if (past) { r.q = past.dataset.past; $('#sq').value = r.q; searchResults(r); return; }
  // impostazioni
  const sw = t.closest('[data-set]');
  if (sw) {
    const id = sw.dataset.set;
    if (id === 'fill') lsSet('xp_fit', lsGet('xp_fit', 'contain') === 'cover' ? 'contain' : 'cover');
    else { const key = {autonext:'xp_autonext', startlast:'xp_startlast'}[id]; lsSet(key, !lsGet(key, id === 'autonext')); }
    sw.classList.toggle('on'); sw.setAttribute('aria-checked', sw.classList.contains('on'));
    return;
  }
  if (t.closest('[data-reload]')) {
    await IDB.clear(); S.data = {}; S.ready = {}; S.visCache = {}; S.featKeys = null;
    toast('Scarico di nuovo il catalogo…');
    await Promise.allSettled(['live', 'movie', 'series'].map(ensure));
    toast('Catalogo aggiornato'); return;
  }
  const pb = t.closest('[data-pin]'); if (pb) return pinAction(pb.dataset.pin);
  const cp = t.closest('[data-cat-pin]'); if (cp) return editCats(r.type, c => { c.pinned[r.type] = toggleIn(c.pinned[r.type] || [], cp.dataset.catPin); });
  const ch = t.closest('[data-cat-hide]'); if (ch) return editCats(r.type, c => { c.hidden[r.type] = toggleIn(c.hidden[r.type] || [], ch.dataset.catHide); });
  const cl = t.closest('[data-cat-lock]'); if (cl) return editCats(r.type, c => { c.locked[r.type] = toggleIn(c.locked[r.type] || [], cl.dataset.catLock); });
  if (t.closest('[data-cats-reset]')) return editCats(r.type, c => { c.pinned[r.type] = []; c.hidden[r.type] = []; });
  // playlist
  if (t.closest('[data-pl-add]')) return showLogin(true);
  const pm = t.closest('[data-pl-menu]'); if (pm) return plMenu(pm.dataset.plMenu);
  const rn = t.closest('[data-pl-rename]');
  if (rn) {
    closeSheet();
    const list = playlists(), p = list.find(x => x.id === rn.dataset.plRename); if (!p) return;
    const v = (prompt('Nuovo nome della playlist', p.name) || '').trim();
    if (v) { p.name = v.slice(0, 40); lsSet(PL_KEY, list); toast('Nome salvato'); renderRoute(false); }
    return;
  }
  const dl = t.closest('[data-pl-del]');
  if (dl) {
    closeSheet();
    const list = playlists(), p = list.find(x => x.id === dl.dataset.plDel); if (!p) return;
    if (!confirm(`Eliminare la playlist “${p.name}” da questo iPhone?`)) return;
    lsSet(PL_KEY, list.filter(x => x.id !== p.id));
    toast('Playlist eliminata');
    if (S.creds && plKey(p) === plKey(S.creds)) logout(); else renderRoute(false);
  }
});
async function pinAction(act){
  if (act === 'off' || act === 'change') {
    const curPin = await askPin('PIN attuale', 'Scrivi il PIN che usi adesso.');
    if (curPin === null) return;
    if (pinHash(curPin) !== lsGet('xp_pin', null)) return toast('PIN sbagliato');
    if (act === 'off') { lsSet('xp_pin', null); S.unlocked = false; S.visVer++; toast('Controllo genitori disattivato'); return renderRoute(false); }
  }
  const a = await askPin('Nuovo PIN', 'Scegli 4 cifre facili da ricordare per te.'); if (a === null) return;
  const b = await askPin('Conferma il PIN', 'Scrivi di nuovo le stesse 4 cifre.'); if (b === null) return;
  if (a !== b) return toast('I due PIN non coincidono: riprova');
  const first = !parentalOn();
  lsSet('xp_pin', pinHash(a)); S.unlocked = false;
  if (first) {
    // alla prima attivazione blocca da solo le categorie per adulti di tutte le sezioni
    await Promise.allSettled(['live', 'movie', 'series'].map(ensure));
    const cfg = catCfg(); let n = 0;
    for (const type of ['live', 'movie', 'series']) {
      const D = S.ready[type]; if (!D) continue;
      const adult = D.cats.filter(c => ADULT_RE.test(c.name)).map(c => c.id);
      n += adult.length; cfg.locked[type] = [...new Set([...(cfg.locked[type] || []), ...adult])];
    }
    lsSet(ns('cats'), cfg);
    toast(n ? `PIN attivo: ho bloccato ${n} categorie per adulti` : 'PIN attivo: scegli le categorie da bloccare in Organizza');
  } else toast('PIN cambiato');
  S.visVer++; renderRoute(false);
}

// ================= avvio =================
(async () => {
  try { STORE = (await (await fetch('/store')).json()) || {}; } catch(_) { STORE = {}; }
  S.liveMode = lsGet('xp_livemode', 'cats') === 'guide' ? 'guide' : 'cats';
  const tm = lsGet('xp_typemode', null); if (tm && typeof tm === 'object') S.typeMode = {movie:tm.movie === 'cats' ? 'cats' : 'discover', series:tm.series === 'cats' ? 'cats' : 'discover'};
  setTheme(lsGet('xp_theme', 'nero'));
  const saved = lsGet('xp_creds', null);
  if (saved && saved.server && !playlists().some(p => plKey(p) === plKey(saved))) {
    lsSet(PL_KEY, [...playlists(), {id:Date.now().toString(36), name:hostOf(saved.server), server:saved.server, username:saved.username, password:saved.password, last:Date.now()}]);
  }
  renderSavedLogin();
  if (saved && saved.server) {
    $('#fServer').value = saved.server; $('#fUser').value = saved.username || ''; $('#fPass').value = saved.password || '';
    $('#login').classList.add('auto');
    login(saved, true, 2);
  }
})();
</script>
