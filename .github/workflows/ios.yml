# Compila l'app per iPhone su un Mac di GitHub e produce il file XtreamPlayer.ipa (non firmato).
# La firma la fa poi Sideloadly (o AltStore) sul tuo PC, con il tuo ID Apple.
name: Compila app iPhone

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Crea il progetto Xcode
        run: xcodegen generate

      - name: Compila
        run: |
          xcodebuild \
            -project XtreamPlayer.xcodeproj \
            -scheme XtreamPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Crea il file .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/XtreamPlayer.app"
          test -d "$APP"
          test -f "$APP/web/index.html"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry XtreamPlayer.ipa Payload
          ls -lh XtreamPlayer.ipa

      - name: Rendi disponibile il file
        uses: actions/upload-artifact@v4
        with:
          name: XtreamPlayer-ipa
          path: XtreamPlayer.ipa
          retention-days: 30
