# In alternativa a GitHub Actions: stessa compilazione su Codemagic (500 minuti gratis al mese su Mac M2).
workflows:
  ios-ipa:
    name: Compila app iPhone
    instance_type: mac_mini_m2
    max_build_duration: 45
    scripts:
      - name: Installa XcodeGen
        script: brew install xcodegen
      - name: Crea il progetto Xcode
        script: xcodegen generate
      - name: Scarica VLC per il player universale
        script: pod install
      - name: Compila
        script: |
          xcodebuild \
            -workspace XtreamPlayer.xcworkspace \
            -scheme XtreamPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Crea il file .ipa
        script: |
          APP="build/Build/Products/Release-iphoneos/XtreamPlayer.app"
          test -d "$APP"
          VLC="$APP/Frameworks/VLCKit.framework/VLCKit"
          if [ -f "$VLC" ]; then xcrun bitcode_strip -r "$VLC" -o "$VLC" || true; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry XtreamPlayer.ipa Payload
    artifacts:
      - XtreamPlayer.ipa
