# In alternativa a GitHub Actions: stessa compilazione su Codemagic (500 minuti gratis al mese su Mac M2).
workflows:
  ios-ipa:
    name: Compila app iPhone
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Installa XcodeGen
        script: brew install xcodegen
      - name: Crea il progetto Xcode
        script: xcodegen generate
      - name: Compila
        script: |
          xcodebuild \
            -project XtreamPlayer.xcodeproj \
            -scheme XtreamPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Crea il file .ipa
        script: |
          APP="build/Build/Products/Release-iphoneos/XtreamPlayer.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry XtreamPlayer.ipa Payload
    artifacts:
      - XtreamPlayer.ipa
